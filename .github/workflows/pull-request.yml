# Checks the title, the description and the commits of a pull request that is
# ready for review with scripts/check-pr.sh: the sections a reviewer needs, the
# prerequisite headings scripts/release.sh reads, and a `Closes #<n>` line in
# every commit when the description closes an issue. Editing the pull request
# runs it again. The commits are those the base branch, as fetched, does not
# have; locally: scripts/check-pr.sh "<title>" origin/dev..HEAD < description.md
name: Pull request

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  description:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Title, description and commits
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_REF: ${{ github.base_ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: printf '%s\n' "$PR_BODY" | scripts/check-pr.sh --head-branch "$PR_HEAD_REF" "$PR_TITLE" "origin/$PR_BASE_REF..$PR_HEAD_SHA"
