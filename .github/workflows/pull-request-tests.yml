# Runs the full build, scripts/check.sh and nothing else, on every pull
# request into dev, on both host platforms hq supports (WSL is Linux) (#176).
# A pull request into any other branch gets no run; the push to dev runs
# tests.yml - see docs/agents/testing.md. hq's own workflow: the template's
# pull-request.yml checks the description (#177).
#
# Skipped when every changed file is one nothing in the build, the tests,
# tools/testgate or e2e reads (#108): Markdown anywhere and docs/ (no
# //go:embed, no code reads them), .claude/ (no Go files; go vet, go test and
# the pyramid gate skip it, and the tests' git repositories are temporary
# ones) and .gitignore (CI builds a fresh checkout). Any other file in the
# change runs the whole workflow. Remove a path from this list the day code
# reads it.
# A skipped workflow reports no check at all: should dev ever require this
# check, docs-only pull requests would wait on it forever, and the filter
# must then move into a job that always runs and skips its steps.
name: Pull request tests

on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tmux
        run: |
          if [ "$RUNNER_OS" = macOS ]; then brew install tmux; else sudo apt-get update -q && sudo apt-get install -yq tmux; fi
          tmux -V

      - name: Full build
        run: scripts/check.sh
