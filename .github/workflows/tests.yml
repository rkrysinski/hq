# Runs the full build, scripts/check.sh and nothing else, once on Linux on
# every push to dev (#176). Pull requests into dev run it on both host
# platforms from pull-request.yml; a pull request into any other branch (a
# release branch) runs neither - see docs/agents/testing.md.
#
# Skipped when every changed file is one nothing in the build, the tests,
# tools/testgate or e2e reads (#108): Markdown anywhere and docs/ (no
# //go:embed, no code reads them), .claude/ (no Go files; go vet, go test and
# the pyramid gate skip it, and the tests' git repositories are temporary
# ones) and .gitignore (CI builds a fresh checkout). Any other file in the
# change runs the whole workflow. Remove a path from this list and from
# pull-request.yml's the day code reads it.
name: Tests

on:
  push:
    branches: [dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.claude/**'
      - '.gitignore'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tmux
        run: |
          sudo apt-get update -q && sudo apt-get install -yq tmux
          tmux -V

      - name: Full build
        run: scripts/check.sh
