# The full build (scripts/check.sh) after every merge to dev. A pull request
# gets no run: the agent runs the same script on the branch before pushing and
# again before the merge - see docs/agents/testing.md, "Merging". Each push to
# dev (a squash merge is one commit) gets a run of its own and none is
# cancelled, so a red run names the commit that broke the build. A commit that
# changes only the files below builds nothing and gets no run.
name: Tests

on:
  push:
    branches: [dev]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.claude/**'
      - '.github/workflows/pull-request.yml'
      - '.github/workflows/release.yml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE.md'
      - '.github/PULL_REQUEST_TEMPLATE/**'

permissions:
  contents: read

jobs:
  full-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Set up the stack's toolchain here (actions/setup-java, setup-go,
      # setup-node...) and the browser for the journeys, when wiring
      # scripts/check.sh. The checks themselves stay in the script.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install tmux
        run: |
          sudo apt-get update -q && sudo apt-get install -yq tmux
          tmux -V

      - name: Full build
        run: scripts/check.sh
